<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFM 27 - Calculadora SBC</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos específicos de calculator.html */
  .wrap { max-width: 1800px; margin: auto; padding: 18px; }
  .card { padding: 18px 20px; box-shadow: 0 12px 35px rgba(0,0,0,.18); }

  .prices-box { margin-bottom: 16px; }
  .price-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .price-header-left {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .calc-badge-logo {
    display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; line-height: 0.9;
    padding-right: 14px; border-right: 1px solid var(--line);
  }
  .calc-badge-logo small { font-size: 9px; color: var(--accent); letter-spacing: 1.5px; }
  .price-header h2 { font-size: 16px; margin: 0 0 2px 0; }
  .price-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  
  .btnrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  /* Cuadrícula de Precios */
  .pricegrid {
    direction: rtl; display: grid; grid-template-columns: repeat(12, minmax(85px, 1fr));
    gap: 8px; height: var(--price-height, 175px); overflow: auto; padding-right: 3px; resize: vertical; min-height: 120px; max-height: 520px;
  }
  .pricegrid::-webkit-scrollbar { width: 7px; height: 7px; }
  .pricegrid::-webkit-scrollbar-thumb { background: #303642; border-radius: 999px; }
  
  .priceitem { direction: ltr; background: #11151d; border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
  .priceitem .rating { font-weight: 900; margin-bottom: 5px; font-size: 13px; color: var(--gold); }
  .priceitem input { padding: 7px 4px; font-size: 13px; text-align: center; font-weight: 800; border-color: #3b4454; }
  .priceitem input:disabled { background: #171c26; color: var(--accent); border-color: transparent; }

  /* Sección Resultados */
  .result { min-height: 250px; }
  .empty { color: var(--muted); display: flex; align-items: center; justify-content: center; min-height: 220px; text-align: center; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: #11151d; border: 1px solid var(--line); border-radius: 12px; padding: 13px; text-align: center; }
  .stat b { display: block; font-size: 22px; margin-top: 4px; text-align: center; color: var(--accent); }
  .stat span { color: var(--muted); font-size: 12px; display: block; }
  .solution { background: #11151d; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .solution h3 { margin: 0 0 10px; font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 15px; padding: 9px 0; border-bottom: 1px solid #232a36; align-items: center; }
  .row:last-child { border-bottom: 0; }
  .row > b { font-size: 16px; }
  .tag { display: inline-block; background: #1c2e28; color: var(--accent); border-radius: 999px; padding: 4px 10px; font-weight: 800; }
  
  .density-wrap { display: flex; align-items: center; gap: 6px; }
  .density-wrap input { width: 85px; padding: 0; background: transparent; border: 0; }
  .error { color: var(--danger); background: #2a171a; border: 1px solid #542126; border-radius: 10px; padding: 11px; }

  @media(max-width: 1100px) {
    .grid { grid-template-columns: 1fr; }
    .pricegrid { grid-template-columns: repeat(8, minmax(80px, 1fr)); }
  }
  @media(max-width: 800px) {
    .calc-badge-logo { border-right: none; padding-right: 0; }
    .pricegrid { grid-template-columns: repeat(5, minmax(78px, 1fr)); }
  }
  @media(max-width: 500px) {
    .inputs { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr; }
    .pricegrid { grid-template-columns: repeat(3, minmax(75px, 1fr)); }
  }
</style>
</head>

function buildPriceGrid() {
  grid.innerHTML = '';
  for (let r = MAX; r >= MIN; r--) {
    const d = document.createElement('div');
    d.className = 'priceitem';
    d.innerHTML = `
      <div class="rating">⭐ ${r}</div>
      <input id="p${r}" type="text" autocomplete="off" placeholder="—">
    `;
    grid.appendChild(d);
  }
}

function formatInputValue(input) {
  const digits = String(input.value).replace(/[^0-9]/g, '');
  if (digits === '') { input.value = ''; return; }
  input.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function parsePrice(v) {
  if (!v) return null;
  const digits = String(v).replace(/[^0-9]/g, '');
  if (digits === '') return null;
  const n = parseInt(digits, 10);
  return Number.isFinite(n) && n >= 0 ? n : null;
}

function fmt(n) {
  return Number(n).toLocaleString('es-ES', { maximumFractionDigits: 0 });
}

function fmtDec(n) {
  return Number(n).toFixed(2).replace('.', ',');
}

function getPricesFromDatabase() {
  const candidateKeys = ['ufm27_database_v3', 'ufm27_db_v7', 'ufm27_database_v6', 'ufm27_database_v5', 'ufm27_database_v4'];
  let playersList = [];
  for (let k of candidateKeys) {
    try {
      const raw = localStorage.getItem(k);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          playersList = parsed;
          break;
        }
      }
    } catch(e) {}
  }

  const minPrices = {};
  playersList.forEach(p => {
    const rat = parseInt(p.rating, 10);
    const pr = p.price !== '' && p.price != null ? parseInt(p.price, 10) : null;
    if (rat >= MIN && rat <= MAX && pr !== null && !isNaN(pr) && pr > 0) {
      if (!minPrices[rat] || pr < minPrices[rat]) {
        minPrices[rat] = pr;
      }
    }
  });

  return minPrices;
}

function updatePriceGridDisplay() {
  const isDb = priceSource === 'db';
  const dbPrices = isDb ? getPricesFromDatabase() : {};
  const manualRaw = localStorage.getItem('ufm_ptc_prices');
  let manualData = {};
  if (manualRaw) {
    try { manualData = JSON.parse(manualRaw); } catch(e) {}
  }

  for (let r = MIN; r <= MAX; r++) {
    const input = document.getElementById('p' + r);
    if (!input) continue;

    if (isDb) {
      input.disabled = true;
      input.value = dbPrices[r] ? fmt(dbPrices[r]) : '';
    } else {
      input.disabled = false;
      input.value = manualData[r] || '';
      formatInputValue(input);
    }
  }

  const t = translations[currentLang] || translations.es;
  document.getElementById('lblSourceHint').textContent = isDb ? t.sourceHintDb : t.sourceHintManual;
}

function setPriceSource(source) {
  priceSource = source;
  document.getElementById('btnSourceDb').classList.toggle('active', source === 'db');
  document.getElementById('btnSourceManual').classList.toggle('active', source === 'manual');
  document.getElementById('btnSaveManual').style.display = source === 'manual' ? 'inline-block' : 'none';
  document.getElementById('btnClearPrices').style.display = source === 'manual' ? 'inline-block' : 'none';
  updatePriceGridDisplay();
}

function saveManualPrices() {
  const data = {};
  for (let r = MIN; r <= MAX; r++) {
    data[r] = document.getElementById('p' + r).value;
  }
  localStorage.setItem('ufm_ptc_prices', JSON.stringify(data));
  const t = translations[currentLang] || translations.es;
  showMessage(t.saved);
}

function confirmClearPrices() {
  const t = translations[currentLang] || translations.es;
  if (confirm(t.clearPrices + "?")) {
    for (let r = MIN; r <= MAX; r++) document.getElementById('p' + r).value = '';
    localStorage.removeItem('ufm_ptc_prices');
    showMessage(t.cleared);
  }
}

function showMessage(msg) {
  const el = document.getElementById('saveMsg');
  el.textContent = msg;
  if (messageTimer) clearTimeout(messageTimer);
  messageTimer = setTimeout(() => el.textContent = '', 4000);
}

function getActivePrices() {
  const prices = {};
  for (let r = MIN; r <= MAX; r++) {
    const val = parsePrice(document.getElementById('p' + r).value);
    if (val !== null && val > 0) prices[r] = val;
  }
  return prices;
}

function thresholdFor(n, target) {
  return target * n - Math.floor(n / 2);
}

function calculate() {
  const n = parseInt(document.getElementById('players').value, 10);
  const target = parseInt(document.getElementById('target').value, 10);
  const out = document.getElementById('result');
  const t = translations[currentLang] || translations.es;

  if (!Number.isInteger(n) || n < 5 || n > 30 || !Number.isInteger(target) || target < 50 || target > 99) {
    out.className = '';
    out.innerHTML = `<div class="error">${t.invalid}</div>`;
    return;
  }

  const prices = getActivePrices();
  const ratings = Object.keys(prices).map(Number).sort((a, b) => a - b);
  if (!ratings.length) {
    out.className = '';
    out.innerHTML = `<div class="error">${t.noPrices}</div>`;
    return;
  }

  const minSum = thresholdFor(n, target);
  const maxSum = n * MAX;

  let dp = new Array(maxSum + 1).fill(null);
  dp[0] = { cost: 0, counts: new Map() };

  for (let slot = 0; slot < n; slot++) {
    const ndp = new Array(maxSum + 1).fill(null);
    for (let s = 0; s <= MAX * slot; s++) {
      const state = dp[s];
      if (!state) continue;
      for (const r of ratings) {
        const ns = s + r;
        const nc = state.cost + prices[r];
        const old = ndp[ns];
        if (!old || nc < old.cost) {
          const counts = new Map(state.counts);
          counts.set(r, (counts.get(r) || 0) + 1);
          ndp[ns] = { cost: nc, counts };
        }
      }
    }
    dp = ndp;
  }

  let best = null, bestSum = null;
  for (let s = minSum; s <= maxSum; s++) {
    if (dp[s] && (!best || dp[s].cost < best.cost || (dp[s].cost === best.cost && s < bestSum))) {
      best = dp[s];
      bestSum = s;
    }
  }

  if (!best) {
    out.className = '';
    out.innerHTML = `<div class="error">${t.noSolution}</div>`;
    return;
  }

  const avg = bestSum / n;
  const rows = [...best.counts.entries()].sort((a, b) => b[0] - a[0]);
  const composition = rows.map(([r, c]) => `
    <div class="row">
      <span><span class="tag">${c} × ⭐ ${r}</span></span>
      <b>${fmt(prices[r] * c)} monedas</b>
    </div>
  `).join('');

  out.className = '';
  out.innerHTML = `
    <div class="summary">
      <div class="stat"><span>${t.totalCost}</span><b>${fmt(best.cost)}</b></div>
      <div class="stat"><span>${t.realRating}</span><b>${fmtDec(avg)}</b></div>
      <div class="stat"><span>${t.targetRating}</span><b>${target}</b></div>
    </div>
    <div class="solution">
      <h3>${t.cheapest}</h3>
      ${composition}
      <div class="row" style="margin-top:6px;padding-top:12px"><span>${t.totalPlayers}</span><b>${n}</b></div>
      <div class="row"><span>${t.ratingSum}</span><b>${bestSum}</b></div>
    </div>
  `;
}

function clearResult() {
  const t = translations[currentLang] || translations.es;
  const out = document.getElementById('result');
  out.className = 'empty';
  out.innerHTML = `<span>${t.emptyResult}</span>`;
}

function applyTranslations() {
  const t = translations[currentLang] || translations.es;
  document.documentElement.lang = currentLang;
  document.getElementById('langSelect').value = currentLang;

  document.getElementById('lblNavHome').textContent = t.navHome;
  document.getElementById('lblNavDb').textContent = t.navDb;
  document.getElementById('lblNavCalc').textContent = t.navCalc;

  document.getElementById('lblPricesTitle').textContent = t.pricesTitle;
  document.getElementById('btnSourceDb').textContent = t.sourceDb;
  document.getElementById('btnSourceManual').textContent = t.sourceManual;
  document.getElementById('btnSaveManual').textContent = t.save;

  document.getElementById('lblSbcData').textContent = t.sbcData;
  document.getElementById('lblPlayers').textContent = t.playersLabel;
  document.getElementById('lblTarget').textContent = t.targetLabel;
  document.getElementById('btnCalculate').textContent = t.calculate;
  document.getElementById('btnClearResult').textContent = t.clear;
  document.getElementById('lblResult').textContent = t.result;

  const result = document.getElementById('result');
  if (result.classList.contains('empty')) {
    result.innerHTML = `<span>${t.emptyResult}</span>`;
  }
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('ufm_lang', currentLang);
  applyTranslations();
  updatePriceGridDisplay();
}

function applyDensity() {
  const val = localStorage.getItem('ufm_price_height') || '175';
  document.documentElement.style.setProperty('--price-height', val + 'px');
  document.getElementById('density').value = val;
}

document.getElementById('density').addEventListener('input', e => {
  const h = e.target.value;
  document.documentElement.style.setProperty('--price-height', h + 'px');
  localStorage.setItem('ufm_price_height', h);
});

// Inicialización
buildPriceGrid();
applyDensity();
applyTranslations();
setPriceSource('db');
</script>
</body>
